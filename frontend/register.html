<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmploiCongo — Créer un compte</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar-ec">
      <a href="index.html" class="brand">Emploi<span>Congo</span></a>
      <div id="navAuthArea"></div>
    </nav>

    <div class="auth-wrap" style="padding: 2rem 1rem">
      <div class="auth-card" style="max-width: 520px">
        <div class="auth-logo">Emploi<span>Congo</span></div>
        <div class="auth-subtitle">Rejoignez la communauté EmploiCongo</div>

        <!-- Role selector -->
        <div class="role-toggle">
          <button
            class="role-btn active"
            id="btnStudent"
            onclick="setRole('STUDENT')"
          >
            🎓 Je suis étudiant(e)
          </button>
          <button class="role-btn" id="btnCompany" onclick="setRole('COMPANY')">
            🏢 Entreprise / ONG
          </button>
        </div>

        <div class="form-error" id="errorBox"></div>

        <!-- Common fields -->
        <div class="form-group">
          <label class="form-label">Nom complet *</label>
          <input
            type="text"
            id="fullName"
            class="form-control"
            placeholder="ex: Jean-Paul Mbeki"
            autocomplete="name"
          />
        </div>
        <div class="form-group">
          <label class="form-label">Adresse email *</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="vous@exemple.com"
            autocomplete="email"
          />
        </div>
        <div class="form-group">
          <label class="form-label"
            >Mot de passe *
            <span class="text-muted">(min. 6 caractères)</span></label
          >
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>

        <!-- Student fields -->
        <div id="studentFields">
          <div class="form-group">
            <label class="form-label">Programme d'études</label>
            <input
              type="text"
              id="degreeProgram"
              class="form-control"
              placeholder="ex: Licence en Informatique, Master en Finance"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Domaine d'études</label>
            <select id="fieldOfStudy" class="form-select">
              <option value="">Sélectionnez un domaine</option>
              <option>Informatique & Développement</option>
              <option>Finance & Comptabilité</option>
              <option>Marketing & Communication</option>
              <option>Ressources Humaines</option>
              <option>Humanitaire & ONG</option>
              <option>Ingénierie</option>
              <option>Santé</option>
              <option>Éducation</option>
              <option>Droit & Juridique</option>
              <option>Autre</option>
            </select>
          </div>
        </div>

        <!-- Company fields -->
        <div id="companyFields" style="display: none">
          <div class="form-group">
            <label class="form-label">Nom de la société / ONG *</label>
            <input
              type="text"
              id="companyName"
              class="form-control"
              placeholder="ex: Vodacom Congo, UNICEF RDC, Rawbank"
            />
          </div>
          <div class="form-group">
            <label class="form-label"
              >Site web <span class="text-muted">(optionnel)</span></label
            >
            <input
              type="text"
              id="companyWebsite"
              class="form-control"
              placeholder="https://www.votre-site.com"
            />
          </div>
          <div class="form-group">
            <label class="form-label"
              >Description <span class="text-muted">(optionnel)</span></label
            >
            <textarea
              id="companyDescription"
              class="form-control"
              rows="3"
              placeholder="Décrivez brièvement votre organisation, votre secteur d'activité..."
            ></textarea>
          </div>
          <div class="form-notice">
            ⚠️ Les comptes entreprise sont vérifiés par notre équipe avant la
            publication d'offres. Vos annonces seront soumises à validation
            administrative. Délai : 24-48 heures.
          </div>
        </div>

        <button
          class="btn btn-navy btn-block mt-3"
          id="registerBtn"
          onclick="doRegister()"
        >
          Créer mon compte
        </button>

        <p
          style="
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.9rem;
            color: var(--muted);
          "
        >
          Déjà un compte ?
          <a
            href="login.html"
            style="color: var(--navy); font-weight: 700; margin-left: 0.3rem"
          >
            Se connecter
          </a>
        </p>
      </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script>
      Lang.init();

      let currentRole = "STUDENT";

      // Pre-select role from URL param
      const urlRole = new URLSearchParams(window.location.search).get("role");
      if (urlRole === "COMPANY") setRole("COMPANY");

      // Redirect if already logged in
      const existing = Api.currentUser();
      if (existing) {
        const map = {
          STUDENT: "student-dashboard.html",
          COMPANY: "company-dashboard.html",
          ADMIN: "admin-dashboard.html",
        };
        window.location.href = map[existing.role] || "index.html";
      }

      function setRole(role) {
        currentRole = role;
        document
          .getElementById("btnStudent")
          .classList.toggle("active", role === "STUDENT");
        document
          .getElementById("btnCompany")
          .classList.toggle("active", role === "COMPANY");
        document.getElementById("studentFields").style.display =
          role === "STUDENT" ? "" : "none";
        document.getElementById("companyFields").style.display =
          role === "COMPANY" ? "" : "none";
      }

      async function doRegister() {
        const btn = document.getElementById("registerBtn");
        const errorBox = document.getElementById("errorBox");
        errorBox.classList.remove("show");

        const payload = {
          fullName: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          role: currentRole,
        };

        if (currentRole === "STUDENT") {
          payload.degreeProgram = document
            .getElementById("degreeProgram")
            .value.trim();
          payload.fieldOfStudy = document.getElementById("fieldOfStudy").value;
        } else {
          payload.companyName = document
            .getElementById("companyName")
            .value.trim();
          payload.companyWebsite = document
            .getElementById("companyWebsite")
            .value.trim();
          payload.companyDescription = document
            .getElementById("companyDescription")
            .value.trim();
        }

        // Validation
        if (!payload.fullName) {
          errorBox.textContent = "Veuillez entrer votre nom complet.";
          errorBox.classList.add("show");
          return;
        }
        if (!payload.email) {
          errorBox.textContent = "Veuillez entrer votre adresse email.";
          errorBox.classList.add("show");
          return;
        }
        if (!payload.password || payload.password.length < 6) {
          errorBox.textContent =
            "Le mot de passe doit contenir au moins 6 caractères.";
          errorBox.classList.add("show");
          return;
        }
        if (currentRole === "COMPANY" && !payload.companyName) {
          errorBox.textContent = "Le nom de la société est obligatoire.";
          errorBox.classList.add("show");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Création du compte...";

        try {
          const data = await Api.post("/auth/register", payload);
          Api.setSession(data);

          const dashMap = {
            STUDENT: "student-dashboard.html",
            COMPANY: "company-dashboard.html",
            ADMIN: "admin-dashboard.html",
          };

          showToast(
            "Compte créé avec succès ! Bienvenue sur EmploiCongo 🎉",
            "success",
          );
          setTimeout(() => {
            window.location.href = dashMap[data.role] || "index.html";
          }, 1000);
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.add("show");
          btn.disabled = false;
          btn.textContent = "Créer mon compte";
        }
      }

      // Allow Enter key to submit
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") doRegister();
      });
    </script>
  </body>
</html>
