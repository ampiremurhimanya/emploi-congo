<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmploiCongo — Offres d'emploi</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar-ec">
      <a href="index.html" class="brand">Emploi<span>Congo</span></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Accueil</a>
        <a href="find-jobs.html" class="nav-link active">Offres d'emploi</a>
        <a href="register.html?role=COMPANY" class="nav-link"
          >Publier une offre</a
        >
      </div>
      <div id="navAuthArea"></div>
    </nav>

    <!-- FILTER BAR -->
    <div
      style="
        background: #fff;
        border-bottom: 1px solid var(--border);
        padding: 1.25rem 1.5rem;
      "
    >
      <div class="container">
        <div class="d-flex flex-wrap gap-2 align-center">
          <input
            type="text"
            id="fKeyword"
            class="form-control"
            placeholder="Titre du poste, mots-clés..."
            style="flex: 1; min-width: 200px"
          />
          <select id="fField" class="form-select" style="max-width: 220px">
            <option value="">Tous les domaines</option>
            <option value="Informatique & Développement">
              💻 Informatique & Dev
            </option>
            <option value="Finance & Comptabilité">
              💰 Finance & Comptabilité
            </option>
            <option value="Marketing & Communication">
              📣 Marketing & Com
            </option>
            <option value="Ressources Humaines">👥 Ressources Humaines</option>
            <option value="Humanitaire & ONG">🌍 Humanitaire & ONG</option>
            <option value="Ingénierie">⚙️ Ingénierie</option>
            <option value="Santé">🏥 Santé</option>
            <option value="Éducation">🎓 Éducation</option>
            <option value="Droit & Juridique">⚖️ Droit & Juridique</option>
            <option value="Autre">Autre</option>
          </select>
          <input
            type="text"
            id="fCompany"
            class="form-control"
            placeholder="Société..."
            style="max-width: 180px"
          />
          <button class="btn btn-navy" onclick="search(0)">
            🔍 Rechercher
          </button>
          <button class="btn btn-outline-dark" onclick="clearFilters()">
            Effacer
          </button>
        </div>
      </div>
    </div>

    <div class="container" style="padding-top: 2rem; padding-bottom: 3rem">
      <div class="d-flex justify-between align-center mb-3 flex-wrap gap-2">
        <div>
          <h2 class="section-title">Offres d'emploi</h2>
          <p class="text-muted text-small" id="resultsCount"></p>
        </div>
      </div>
      <div id="resultsList"><div class="spinner"></div></div>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- APPLY MODAL -->
    <div id="applyModal" class="modal-overlay" style="display: none">
      <div class="modal-box">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-title" id="applyModalTitle">Postuler</div>
        <p class="text-muted text-small mb-3">
          Votre CV actuel sera joint automatiquement à cette candidature.
        </p>
        <div class="form-group">
          <label class="form-label">Lettre de motivation (optionnel)</label>
          <textarea
            id="coverNote"
            class="form-control"
            rows="4"
            placeholder="Expliquez brièvement pourquoi vous êtes le candidat idéal..."
          ></textarea>
        </div>
        <div class="d-flex gap-2 justify-end mt-3">
          <button class="btn btn-outline-dark" onclick="closeModal()">
            Annuler
          </button>
          <button
            class="btn btn-navy"
            id="confirmApplyBtn"
            onclick="confirmApply()"
          >
            Envoyer ma candidature
          </button>
        </div>
      </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script>
      let currentPage = 0;
      let pendingOpportunityId = null;
      const user = Api.currentUser();

      const params = new URLSearchParams(window.location.search);
      if (params.get("keyword"))
        document.getElementById("fKeyword").value = params.get("keyword");
      if (params.get("field"))
        document.getElementById("fField").value = params.get("field");

      function clearFilters() {
        document.getElementById("fKeyword").value = "";
        document.getElementById("fField").value = "";
        document.getElementById("fCompany").value = "";
        search(0);
      }

      function buildQuery(page) {
        const q = new URLSearchParams();
        const k = document.getElementById("fKeyword").value.trim();
        const f = document.getElementById("fField").value;
        const c = document.getElementById("fCompany").value.trim();
        if (k) q.set("keyword", k);
        if (f) q.set("field", f);
        if (c) q.set("companyName", c);
        q.set("page", page);
        q.set("size", 10);
        return q.toString();
      }

      function renderCard(o) {
        const isStudent = user && user.role === "STUDENT";

        // ── Deadline urgency ──────────────────────────
        let deadlineHtml = "";
        if (o.application_deadline) {
          const today = new Date();
          const deadline = new Date(o.application_deadline);
          const diffDays = Math.ceil(
            (deadline - today) / (1000 * 60 * 60 * 24),
          );
          let dStyle = "",
            dLabel = "";

          if (diffDays <= 3) {
            dStyle =
              "background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;";
            dLabel =
              diffDays === 0
                ? `Expire aujourd'hui`
                : `Expire dans ${diffDays} jour${diffDays > 1 ? "s" : ""}`;
          } else if (diffDays <= 7) {
            dStyle =
              "background:#fef3c7;color:#92400e;border:1px solid #fcd34d;";
            dLabel = `${diffDays} jours restants`;
          } else {
            dStyle =
              "background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;";
            dLabel = `Clôture le ${formatDate(o.application_deadline)}`;
          }

          deadlineHtml = `
        <span style="
          ${dStyle}
          padding:0.35em 0.9em;
          border-radius:999px;
          font-size:0.78rem;
          font-weight:700;
          white-space:nowrap;">
          ${dLabel}
        </span>`;
        }

        // ── Contract type ─────────────────────────────
        const contractHtml = o.employment_type
          ? `
      <span style="
        background:#f1f5f9;color:#334155;
        border:1px solid #e2e8f0;
        padding:0.35em 0.9em;border-radius:999px;
        font-size:0.78rem;font-weight:700;">
        ${escapeHtml(o.employment_type)}
      </span>`
          : "";

        // ── Salary ────────────────────────────────────
        const salaryHtml = o.salary_range
          ? `
      <span style="
        background:#f0fdf4;color:#166534;
        border:1px solid #bbf7d0;
        padding:0.35em 0.9em;border-radius:999px;
        font-size:0.78rem;font-weight:700;">
        ${escapeHtml(o.salary_range)}
      </span>`
          : "";

        // ── Verified ──────────────────────────────────
        const verifiedHtml = o.verified_company
          ? `
      <span style="
        font-size:0.78rem;font-weight:700;color:#166534;">
        ✓ Vérifiée
      </span>`
          : "";

        // ── Actions ───────────────────────────────────
        let actions = "";
        if (!user) {
          actions = `
        <a href="login.html" class="btn btn-navy btn-sm">
          Se connecter pour postuler
        </a>`;
        } else if (isStudent) {
          actions = `
        <button class="btn btn-outline-dark btn-sm save-btn" data-id="${o.id}">
          ☆ Sauvegarder
        </button>
        <button class="btn btn-navy btn-sm apply-btn"
          data-id="${o.id}" data-title="${escapeHtml(o.title)}">
          Postuler
        </button>`;
        } else {
          actions = `
        <a href="login.html" class="btn btn-outline-dark btn-sm">
          Postuler
        </a>`;
        }

        // ── Description — profil recherché ────────────
        const descHtml = o.description
          ? `
      <div style="margin-top:0.85rem;padding-top:0.85rem;
        border-top:1px solid #f1f5f9;">
        <div style="
          font-size:0.7rem;font-weight:800;
          text-transform:uppercase;letter-spacing:0.08em;
          color:#94a3b8;margin-bottom:0.4rem;">
          Profil recherché
        </div>
        <div style="
          font-size:0.87rem;color:#334155;
          line-height:1.7;
          display:-webkit-box;
          -webkit-line-clamp:3;
          -webkit-box-orient:vertical;
          overflow:hidden;">
          ${escapeHtml(o.description)}
        </div>
      </div>`
          : "";

        return `
      <div style="
        background:#fff;
        border:1px solid #e2e8f0;
        border-radius:16px;
        padding:1.5rem 1.75rem;
        transition:box-shadow 0.15s,transform 0.15s;
      "
      onmouseover="this.style.boxShadow='0 6px 20px rgba(0,0,0,0.08)';this.style.transform='translateY(-2px)'"
      onmouseout="this.style.boxShadow='none';this.style.transform='none'">

        <div class="d-flex gap-4 align-start">

          <!-- Company logo -->
          <div style="
            width:52px;height:52px;border-radius:13px;
            background:var(--navy);color:#fff;
            font-weight:900;font-size:1.2rem;
            display:flex;align-items:center;justify-content:center;
            flex-shrink:0;">
            ${escapeHtml((o.company_name || "?")[0].toUpperCase())}
          </div>

          <div style="flex:1;min-width:0;">

            <!-- Row 1: Title + Actions -->
            <div style="display:flex;justify-content:space-between;
              align-items:flex-start;gap:1rem;flex-wrap:wrap;">
              <div style="flex:1;min-width:0;">
                <div style="
                  font-size:1.08rem;font-weight:900;
                  color:var(--navy);margin-bottom:0.2rem;">
                  ${escapeHtml(o.title)}
                </div>
                <div style="font-size:0.87rem;color:#64748b;">
                  <span style="font-weight:600;color:#374151;">
                    ${escapeHtml(o.company_name)}
                  </span>
                  &nbsp;·&nbsp;
                  📍 ${escapeHtml(o.location || "Non spécifié")}
                  ${verifiedHtml ? `&nbsp;·&nbsp; ${verifiedHtml}` : ""}
                </div>
              </div>
              <div style="
                display:flex;flex-direction:column;
                gap:0.5rem;align-items:flex-end;flex-shrink:0;">
                ${actions}
              </div>
            </div>

            <!-- Row 2: Tags -->
            <div style="
              display:flex;flex-wrap:wrap;
              gap:0.5rem;align-items:center;
              margin-top:0.85rem;">
              ${contractHtml}
              ${salaryHtml}
              ${deadlineHtml}
            </div>

            <!-- Row 3: Profil recherché -->
            ${descHtml}

          </div>
        </div>
      </div>`;
      }

      function renderPagination(data) {
        const el = document.getElementById("pagination");
        if (data.totalPages <= 1) {
          el.innerHTML = "";
          return;
        }
        let html = `<button class="page-btn" onclick="search(${data.number - 1})"
      ${data.number === 0 ? "disabled" : ""}>←</button>`;
        for (let i = 0; i < data.totalPages; i++) {
          html += `<button class="page-btn ${i === data.number ? "active" : ""}"
        onclick="search(${i})">${i + 1}</button>`;
        }
        html += `<button class="page-btn" onclick="search(${data.number + 1})"
      ${data.number === data.totalPages - 1 ? "disabled" : ""}>→</button>`;
        el.innerHTML = html;
      }

      async function search(page = 0) {
        currentPage = page;
        const list = document.getElementById("resultsList");
        list.innerHTML = '<div class="spinner"></div>';
        document.getElementById("resultsCount").textContent = "Chargement...";
        try {
          const data = await Api.get(
            "/opportunities/public/search?" + buildQuery(page),
          );
          document.getElementById("resultsCount").textContent =
            `${data.totalElements} offre(s) trouvée(s)`;
          if (!data.content || data.content.length === 0) {
            list.innerHTML = `
          <div class="empty-state">
            <span class="empty-icon">🔍</span>
            <p>Aucune opportunité ne correspond à votre recherche.</p>
            <p class="text-small mt-2">
              Essayez des mots-clés différents ou effacez les filtres.
            </p>
          </div>`;
            document.getElementById("pagination").innerHTML = "";
            return;
          }
          list.innerHTML = `<div style="display:flex;flex-direction:column;gap:1rem;">
        ${data.content.map(renderCard).join("")}
      </div>`;
          renderPagination(data);
          wireActions();
        } catch (err) {
          list.innerHTML = `
        <div class="empty-state">
          <span class="empty-icon">⚠️</span>
          <p>${escapeHtml(err.message)}</p>
        </div>`;
        }
      }

      function wireActions() {
        document.querySelectorAll(".apply-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            if (!user) {
              window.location.href = "login.html";
              return;
            }
            pendingOpportunityId = btn.dataset.id;
            document.getElementById("applyModalTitle").textContent =
              "Postuler — " + btn.dataset.title;
            document.getElementById("coverNote").value = "";
            document.getElementById("applyModal").style.display = "flex";
          });
        });

        document.querySelectorAll(".save-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            try {
              const res = await Api.post("/student/saved/" + btn.dataset.id);
              btn.textContent = res.saved ? "★ Sauvegardé" : "☆ Sauvegarder";
              showToast(
                res.saved
                  ? "Offre sauvegardée !"
                  : "Offre retirée des sauvegardes.",
              );
            } catch (err) {
              if (err.message.includes("connecter"))
                window.location.href = "login.html";
              else showToast(err.message, "error");
            }
          });
        });
      }

      function closeModal() {
        document.getElementById("applyModal").style.display = "none";
      }

      async function confirmApply() {
        const btn = document.getElementById("confirmApplyBtn");
        const note = document.getElementById("coverNote").value.trim();
        btn.disabled = true;
        btn.textContent = "Envoi...";
        try {
          await Api.post(`/student/applications/${pendingOpportunityId}`, {
            coverNote: note,
          });
          closeModal();
          showToast("Candidature envoyée avec succès ! ✅");
          search(currentPage);
        } catch (err) {
          showToast(err.message, "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "Envoyer ma candidature";
        }
      }

      ["fKeyword", "fCompany"].forEach((id) => {
        document.getElementById(id).addEventListener("keydown", (e) => {
          if (e.key === "Enter") search(0);
        });
      });
      document
        .getElementById("fField")
        .addEventListener("change", () => search(0));
      search(0);
    </script>
  </body>
</html>
