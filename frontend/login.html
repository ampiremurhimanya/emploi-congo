<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmploiCongo — Connexion</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar-ec">
      <a href="index.html" class="brand">Emploi<span>Congo</span></a>
      <div id="navAuthArea"></div>
    </nav>

    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">Emploi<span>Congo</span></div>
        <div class="auth-subtitle" data-i18n="loginSubtitle">
          Connectez-vous à votre compte EmploiCongo
        </div>

        <div class="form-error" id="errorBox"></div>

        <div class="form-group">
          <label class="form-label" data-i18n="email">Adresse email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="vous@exemple.com"
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>

        <button
          class="btn btn-navy btn-block mt-3"
          id="loginBtn"
          onclick="doLogin()"
        >
          Se connecter
        </button>

        <p
          style="
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.9rem;
            color: var(--muted);
          "
        >
          <span data-i18n="noAccount">Pas encore de compte ?</span>
          <a
            href="register.html"
            style="color: var(--navy); font-weight: 700; margin-left: 0.3rem"
            data-i18n="createOne"
            >En créer un</a
          >
        </p>

        <div class="demo-box">
          <strong>Comptes de démonstration :</strong>
          Admin : admin@emploicongo.cd / Admin@2024<br />
          Étudiant : etudiant@unikin.ac.cd / Student@123<br />
          Entreprise : rh@vodacom.cd / Company@123
        </div>
      </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script>
      Lang.init();

      // Redirect if already logged in
      const existing = Api.currentUser();
      if (existing) {
        const map = {
          STUDENT: "student-dashboard.html",
          COMPANY: "company-dashboard.html",
          ADMIN: "admin-dashboard.html",
        };
        window.location.href = map[existing.role] || "index.html";
      }

      // Allow Enter key
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") doLogin();
      });

      async function doLogin() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const btn = document.getElementById("loginBtn");
        const errorBox = document.getElementById("errorBox");

        errorBox.classList.remove("show");

        if (!email || !password) {
          errorBox.textContent = "Veuillez remplir tous les champs.";
          errorBox.classList.add("show");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Connexion...";

        try {
          const data = await Api.post("/auth/login", { email, password });
          Api.setSession(data);

          const dashMap = {
            STUDENT: "student-dashboard.html",
            COMPANY: "company-dashboard.html",
            ADMIN: "admin-dashboard.html",
          };
          showToast(
            "Connexion réussie ! Bienvenue " +
              data.fullName.split(" ")[0] +
              " 👋",
            "success",
          );
          setTimeout(() => {
            window.location.href = dashMap[data.role] || "index.html";
          }, 800);
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.add("show");
          btn.disabled = false;
          btn.textContent = "Se connecter";
        }
      }
    </script>
  </body>
</html>
